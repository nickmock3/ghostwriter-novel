[package]
name = "ghostwriter"
version = "1.0.6"
description = "Ghostwriter desktop shell"
authors = ["Ghostwriter"]
edition = "2021"

[lib]
name = "ghostwriter_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ghostwriter"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.2", features = [] }
url = "2"
ureq = { version = "2.12", default-features = false, features = ["tls"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"

[dev-dependencies]
tempfile = "3"
